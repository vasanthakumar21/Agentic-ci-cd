[project]
name = "cicdgen"
version = "0.1.0"
description = "Agentic, platform-agnostic CI/CD generator — a pipeline-as-data compiler with two independent plugin axes (ci_vendor × target_platform)."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",        # fail-fast IR validation (mirrors tekflow-ingest)
    "jsonschema>=4.0",      # published JSON Schema validation of the IR
    "pyyaml>=6.0",          # read pipeline.yaml (IR) + .cicd/*.local.yaml
    "jinja2>=3.1",          # deterministic per-vendor template rendering
    "python-dotenv>=1.0",   # read admin tokens / runner tokens from env
]

[project.scripts]
cicdgen = "cicdgen.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator/cicdgen"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.0",
]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["cicdgen"]

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths     = ["tests"]
pythonpath    = ["generator"]
addopts       = "--cov=generator/cicdgen --cov-report=term-missing"
log_cli       = true
log_cli_level = "INFO"
