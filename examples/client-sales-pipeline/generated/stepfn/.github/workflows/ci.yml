name: sales-orchestrator CI
"on":
  push:
    branches:
    - main
    - PROJ-*
    - feature/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: test
      run: |
        echo 'Validating ASL state-machine definition is well-formed (aws-stepfunctions)'
        if [ -f stepfunctions/state-machine.asl.json ]; then python -c "import json; json.load(open('stepfunctions/state-machine.asl.json'))" && echo 'ASL definition is valid JSON'; else echo 'no ASL definition staged yet; skipping'; fi
        python -m pip install --quiet pytest 2>/dev/null || true; if ls tests/*.py test_*.py 2>/dev/null | grep -q .; then pytest -q; else echo "no tests; skipping"; fi
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    env:
      SFN_ARTIFACT_BUCKET: ${{ secrets.SFN_ARTIFACT_BUCKET }}
      SFN_DEFINITION_KEY: ${{ secrets.SFN_DEFINITION_KEY }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: build
      run: |
        echo 'Building Step Functions state machine: client ASL (NO image)'
        echo 'Using client-authored ASL definition: src/stepfn/asl/state-machine.json'
        mkdir -p "$(dirname stepfunctions/state-machine.asl.json)"
        cp src/stepfn/asl/state-machine.json stepfunctions/state-machine.asl.json
        python -c "import json; json.load(open('stepfunctions/state-machine.asl.json'))" && echo 'ASL definition validated'
        echo 'Uploading ASL definition to S3 (aws-stepfunctions) — no image push'
        aws s3api put-object --bucket $SFN_ARTIFACT_BUCKET --key $SFN_DEFINITION_KEY --body stepfunctions/state-machine.asl.json --region ap-southeast-2
  deploy-dev:
    name: deploy-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      SFN_ROLE_ARN: ${{ secrets.SFN_ROLE_ARN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: deploy-dev
      run: |
        echo 'Deploying Step Functions state machine (create/update via CLI) — NO ECS'
        mkdir -p "$(dirname stepfunctions/state-machine.asl.json)" && cp src/stepfn/asl/state-machine.json stepfunctions/state-machine.asl.json
        EXISTING_ARN="$(aws stepfunctions list-state-machines --region ap-southeast-2 --query "stateMachines[?name=='sales-orchestrator-sfn'].stateMachineArn" --output text)"
        if [ -n "$EXISTING_ARN" ]; then aws stepfunctions update-state-machine --state-machine-arn "$EXISTING_ARN" --region ap-southeast-2 --definition "$(cat stepfunctions/state-machine.asl.json)" --role-arn $SFN_ROLE_ARN; else aws stepfunctions create-state-machine --name sales-orchestrator-sfn --region ap-southeast-2 --definition "$(cat stepfunctions/state-machine.asl.json)" --role-arn $SFN_ROLE_ARN; fi
        echo 'Starting Step Functions execution and polling status (aws-stepfunctions)'
        SM_ARN="$(aws stepfunctions list-state-machines --region ap-southeast-2 --query "stateMachines[?name=='sales-orchestrator-sfn'].stateMachineArn" --output text)"
        EXEC_ARN="$(aws stepfunctions start-execution --state-machine-arn "$SM_ARN" --region ap-southeast-2 --query 'executionArn' --output text)"
        while true; do STATUS="$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --region ap-southeast-2 --query 'status' --output text)"; if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED_OUT" ] || [ "$STATUS" = "ABORTED" ]; then break; fi; echo "execution status: $STATUS; waiting..."; sleep 5; done
        echo "execution final status: $STATUS"; [ "$STATUS" = "SUCCEEDED" ]
