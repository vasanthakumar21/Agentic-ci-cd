name: sales-file-check CI
"on":
  push:
    branches:
    - main
    - PROJ-*
    - feature/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: test
      run: |
        echo 'Linting function code (aws-lambda)'
        if command -v ruff >/dev/null 2>&1; then ruff check .; else echo 'ruff not found; skipping function code lint'; fi
        python -m pip install --quiet -r requirements.txt pytest 2>/dev/null || true; if ls tests/*.py test_*.py 2>/dev/null | grep -q .; then pytest -q; else echo "no tests found; skipping"; fi
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    env:
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}
      LAMBDA_ARTIFACT_KEY: ${{ secrets.LAMBDA_ARTIFACT_KEY }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: build
      run: |
        echo 'Building AWS Lambda deployment zip (aws-lambda) — NO image'
        echo 'Function source directory: src/lambda'
        rm -rf .lambda_build lambda-package.zip
        mkdir -p .lambda_build
        if [ -f src/lambda/requirements.txt ]; then pip install --target .lambda_build -r src/lambda/requirements.txt; else echo 'no requirements.txt; skipping dependency install'; fi
        cp -r src/lambda/. .lambda_build/app_src && rm -rf .lambda_build/app_src/.lambda_build .lambda_build/app_src/.git || true
        cp -r .lambda_build/app_src/. .lambda_build/ 2>/dev/null || true
        rm -rf .lambda_build/app_src
        (cd .lambda_build && zip -r -X ../lambda-package.zip . -x '*.git*' -x '*.venv*')
        echo 'Built deployment zip: lambda-package.zip'
        echo 'Uploading Lambda zip to S3 (aws-lambda)'
        aws s3api put-object --bucket $LAMBDA_ARTIFACT_BUCKET --key $LAMBDA_ARTIFACT_KEY --body lambda-package.zip --region ap-southeast-2
  deploy-dev:
    name: deploy-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      LAMBDA_ALIAS: ${{ secrets.LAMBDA_ALIAS }}
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}
      LAMBDA_ARTIFACT_KEY: ${{ secrets.LAMBDA_ARTIFACT_KEY }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (access keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2
    - name: deploy-dev
      run: |
        echo 'Deploying to Lambda (aws-lambda)'
        aws lambda update-function-code --function-name sales-file-check --s3-bucket $LAMBDA_ARTIFACT_BUCKET --s3-key $LAMBDA_ARTIFACT_KEY --region ap-southeast-2 --publish
        aws lambda wait function-updated --function-name sales-file-check --region ap-southeast-2
        NEW_VERSION="$(aws lambda publish-version --function-name sales-file-check --region ap-southeast-2 --query Version --output text)"
        aws lambda update-alias --function-name sales-file-check --name $LAMBDA_ALIAS --function-version "$NEW_VERSION" --region ap-southeast-2
        echo 'Verifying Lambda function (smoke test) (aws-lambda)'
        aws lambda wait function-updated --function-name sales-file-check --region ap-southeast-2
        STATE="$(aws lambda get-function-configuration --function-name sales-file-check:$LAMBDA_ALIAS --region ap-southeast-2 --query State --output text)"
        echo "function state: $STATE"; [ "$STATE" = "Active" ]
        aws lambda invoke --function-name sales-file-check:$LAMBDA_ALIAS --payload '{}' --cli-binary-format raw-in-base64-out --region ap-southeast-2 lambda-smoke-out.json --query 'FunctionError' --output text > lambda-smoke-error.txt
        if grep -q -v '^None$' lambda-smoke-error.txt && [ -s lambda-smoke-error.txt ] && ! grep -q '^None$' lambda-smoke-error.txt; then echo "smoke invocation reported a function error"; cat lambda-smoke-out.json; exit 1; else echo "smoke invocation ok"; fi
