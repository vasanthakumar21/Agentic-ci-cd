# Sample IR (task 12.2) — GitHub Actions x Azure Functions.
# Existing CI vendor (github) composed with a new target (azure-functions).
# azure-functions -> cloud.provider azure; the deploy shape is a function app
# publish (NO Dockerfile).
version: 1
ci_vendor: github
target_platform: azure-functions

project:
  name: orders-func
  language: python

cloud:
  provider: azure
  region: uksouth
  auth: oidc

environments:
  - name: dev
    gate: auto
    protection: none
  - name: prod
    gate: manual
    protection: required-approvals

stages:
  - id: test
    timeout_minutes: 15
    runs: pytest -q
    scans: [sast, secrets]
  - id: build
    timeout_minutes: 30
    runs: make build
  - id: deploy-dev
    environment: dev
    runs: make deploy ENV=dev
  - id: deploy-prod
    environment: prod
    when: manual
    runs: make deploy ENV=prod
    approvals:
      required: 2
      from_group: platform-approvers
