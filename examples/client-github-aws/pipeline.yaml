# Sample IR (pipeline.yaml) — client: GitHub Actions x AWS ECS.
# Validates against ir/pipeline.schema.json. Demonstrates the two independent
# axes: ci_vendor (where it runs) x target_platform (what it deploys).
#
# This is the GitHub x <target> counterpart to examples/client-azdo-databricks.
# It exercises every GitHub Actions mapping concern (design §8a) that task 6.2
# asks us to generate + validate: stage order (needs), a manual prod gate
# (environment + required approvals), security scans, cloud OIDC, and timeouts.
version: 1
ci_vendor: github               # github | gitlab | azure-devops | bitbucket | jenkins
target_platform: aws-ecs        # aws-ecs | databricks | azure-functions | kubernetes

project:
  name: orders-api
  language: python

cloud:
  provider: aws                 # aws | azure | gcp (driven by target_platform)
  region: eu-west-2
  auth: oidc                    # oidc | keys (keys discouraged) -> drives id-token: write

environments:
  - name: dev
    gate: auto                  # deploy-dev runs without a human gate
    protection: none
  - name: prod
    gate: manual                # deploy-prod is gated by a GitHub environment reviewer
    protection: required-approvals

stages:                         # array order = pipeline order (rendered as needs chain)
  - id: test
    enabled: true
    timeout_minutes: 15
    retries: 1
    runs: make test
    scans: [sast, secrets]      # contribute steps to a single `security` job
  - id: build
    enabled: true
    timeout_minutes: 30
    runs: make build
  - id: deploy-dev
    enabled: true
    environment: dev
    runs: make deploy ENV=dev
  - id: deploy-prod
    enabled: true
    environment: prod
    when: manual                # manual prod gate
    runs: make deploy ENV=prod
    approvals:
      required: 2
      from_group: platform-approvers   # resolved from .cicd/*.local.yaml at bootstrap

thresholds:
  coverage_min_percent: 80
  max_build_minutes: 30

notifications:
  recipients: [team@example.com]
