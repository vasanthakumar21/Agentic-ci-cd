# Kubernetes Service for the kubernetes target (generated — design §8b).
#
# Namespace is a ${VAR} placeholder substituted at deploy time (R6).
# Deterministic: stable key order, no timestamps (R5.3).
apiVersion: v1
kind: Service
metadata:
  name: minimal-svc-service
  namespace: ${NAMESPACE}
  labels:
    app: minimal-svc
spec:
  type: ClusterIP
  selector:
    app: minimal-svc
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
