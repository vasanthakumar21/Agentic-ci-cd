name: full-svc CI
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: SAST scan
      run: echo 'run SAST scan'
    - name: Secret scan
      run: echo 'run secret scan'
    - name: Dependency scan
      run: echo 'run dependency scan'
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: test
      run: |
        echo 'Linting Dockerfile (azure-container-apps)'
        if command -v hadolint >/dev/null 2>&1; then hadolint Dockerfile; else echo 'hadolint not found; skipping Dockerfile lint'; fi
        make test
    # retries=1 requested; GitHub Actions has no native job retry. Wire a step-level retry action (e.g. nick-fields/retry) if needed.
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: build
      run: |
        echo 'Building container image (azure-container-apps)'
        docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG -f Dockerfile .
        echo 'Pushing image to Azure Container Registry (azure-container-apps)'
        az acr login --name $ACR_NAME
        docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
  deploy-dev:
    name: deploy-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ secrets.CONTAINER_APP }}
      HEALTH: ${{ secrets.HEALTH }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
      REVISION: ${{ secrets.REVISION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: deploy-dev
      run: |
        echo 'Deploying to Azure Container Apps (azure-container-apps)'
        az containerapp update --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --image $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
        echo 'Verifying Container Apps latest revision health (azure-container-apps)'
        REVISION="$(az containerapp show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --query 'properties.latestRevisionName' --output tsv)"
        echo "Latest revision: $REVISION"
        while true; do STATE="$(az containerapp revision show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --revision "$REVISION" --query 'properties.provisioningState' --output tsv)"; if [ "$STATE" = "Provisioned" ] || [ "$STATE" = "Failed" ]; then break; fi; echo "revision provisioningState: $STATE; waiting..."; sleep 10; done
        echo "revision provisioningState: $STATE"; [ "$STATE" = "Provisioned" ]
        HEALTH="$(az containerapp revision show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --revision "$REVISION" --query 'properties.healthState' --output tsv)"
        echo "revision healthState: $HEALTH"; [ "$HEALTH" = "Healthy" ] || [ "$HEALTH" = "None" ]
        az containerapp show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --query 'properties.configuration.ingress.fqdn' --output tsv
  deploy-prod:
    name: deploy-prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ secrets.CONTAINER_APP }}
      HEALTH: ${{ secrets.HEALTH }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
      REVISION: ${{ secrets.REVISION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: deploy-prod
      run: |
        echo 'Deploying to Azure Container Apps (azure-container-apps)'
        az containerapp update --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --image $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
        echo 'Verifying Container Apps latest revision health (azure-container-apps)'
        REVISION="$(az containerapp show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --query 'properties.latestRevisionName' --output tsv)"
        echo "Latest revision: $REVISION"
        while true; do STATE="$(az containerapp revision show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --revision "$REVISION" --query 'properties.provisioningState' --output tsv)"; if [ "$STATE" = "Provisioned" ] || [ "$STATE" = "Failed" ]; then break; fi; echo "revision provisioningState: $STATE; waiting..."; sleep 10; done
        echo "revision provisioningState: $STATE"; [ "$STATE" = "Provisioned" ]
        HEALTH="$(az containerapp revision show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --revision "$REVISION" --query 'properties.healthState' --output tsv)"
        echo "revision healthState: $HEALTH"; [ "$HEALTH" = "Healthy" ] || [ "$HEALTH" = "None" ]
        az containerapp show --name $CONTAINER_APP --resource-group $AZURE_RESOURCE_GROUP --query 'properties.configuration.ingress.fqdn' --output tsv
